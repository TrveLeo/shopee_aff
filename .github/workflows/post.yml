name: post
on:
  schedule:
    - cron: "0 14 * * *"   # 11:00 BRT
    - cron: "0 23 * * *"   # 20:00 BRT
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m shopee_aff.main
        env:
          PYTHONPATH: src
          DRY_RUN: "0"
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data site && (git diff --cached --quiet || git commit -m "post" && git push)
