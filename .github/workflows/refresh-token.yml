name: refresh-ig-token
on:
  schedule:
    - cron: "0 12 1,15 * *"   # twice a month; token lives ~60d, refresh needs it >24h old and still valid
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh token and update secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}   # fine-grained PAT: this repo only, Secrets read/write
        run: |
          set -euo pipefail
          resp=$(curl -fsS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          new=$(echo "$resp" | jq -r '.access_token // empty')
          days=$(echo "$resp" | jq -r '(.expires_in // 0) / 86400 | floor')
          [ -n "$new" ] || { echo "refresh failed"; exit 1; }
          echo "::add-mask::$new"
          printf '%s' "$new" | gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "token renewed, valid ~${days} days"
